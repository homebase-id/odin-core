name: "Host: Deploy latest release tag to production"

#
# Resolves the newest published vX.Y.Z tag on the GitHub side and passes it to
# the controller explicitly. The privileged script never resolves anything over
# the network, so every deploy is reproducible from its Actions log. See the
# DevOps repo:
# docs/superpowers/specs/2026-08-10-github-deploy-button-design.md
#

on:
  workflow_dispatch:
    inputs:
      start_choice:
        type: choice
        required: true
        description: "Start container"
        options:
        - 'true'
        - 'false'

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    outputs:
      version_tag: ${{ steps.latest.outputs.version_tag }}

    steps:
      - name: Only allow main branch
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "Error: Workflow must run on 'main' branch. Current ref: ${GITHUB_REF}"
          exit 1

      - name: Resolve the newest release tag in ghcr
        id: latest
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          repo="$(printf '%s' "$GH_REPO" | tr '[:upper:]' '[:lower:]')"

          # Never echo the registry token. GitHub masks GITHUB_TOKEN in logs but
          # not a bearer token minted from it, and the previous version of this
          # step printed it in cleartext under `set -x`.
          registry_token="$(curl -fsS -u "${GH_ACTOR}:${GH_TOKEN}" \
            "https://${REGISTRY}/token?scope=repository:${repo}:pull" | jq -r '.token')"
          if [ -z "$registry_token" ] || [ "$registry_token" = "null" ]; then
            echo "could not obtain a pull token for ${repo}"
            exit 1
          fi

          tags_json="$(curl -fsS -H "Authorization: Bearer ${registry_token}" \
            "https://${REGISTRY}/v2/${repo}/tags/list?n=999999999")"
          tag="$(printf '%s' "$tags_json" | jq -r '.tags[]?' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "$tag" ]; then
            echo "no vX.Y.Z tag found in ${repo}"
            exit 1
          fi

          echo "Latest release tag: ${tag}"
          echo "version_tag=${tag}" >>"$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest

    # Environment secrets reach only the job that declares the environment.
    # That is the whole reason this is a second job. The environment carries no
    # branch policy and no reviewers.
    environment: deploy

    # The deploy job needs no GITHUB_TOKEN at all.
    permissions: {}

    steps:
      # Deliberately written inline and repeated across the deploy workflows
      # rather than factored into a composite action. The action this replaced
      # took the ansible SSH key as an input, and a composite action taking a
      # key as an input is the shape being removed: it moves the privileged step
      # out of the file under review. Repeating a dozen lines is the cheaper
      # half of that trade.
      #
      # Every ${{ }} goes through env: and is read back as a shell variable.
      # GitHub substitutes expressions into the script text before bash parses
      # it, so an inline tag carrying shell metacharacters would execute inside
      # the job that holds the deploy key. Do not simplify this.
      #
      # The controller validates every field again, independently, in two scripts
      # running as two different users. It constructs the image reference itself
      # from REPOSITORY and TAG and will not accept one.
      - name: Deploy through the ansible controller
        env:
          CONTROLLER: deploy@167.235.203.161
          ENV_NAME: production
          REPOSITORY: odin-core
          TAG: ${{ needs.resolve.outputs.version_tag }}
          START_CONTAINER: ${{ github.event.inputs.start_choice }}
          DEPLOY_KEY: ${{ secrets.CONTROLLER_DEPLOY_KEY }}
        run: |
          key="${RUNNER_TEMP}/controller_deploy_key"
          trap 'rm -f "$key"' EXIT
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$CONTROLLER" \
            "deploy odin-core ${ENV_NAME} ${REPOSITORY} ${TAG} start_container=${START_CONTAINER}"
