name: "SetupHelper: Build and deploy container"

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

#
# Build and push only. The deploy step is gone: it used secrets.ANSIBLE_SSH_KEY,
# an SSH key for the `ansible` account on the ansible controller, which is root
# on every host in the fleet and holds the ansible-vault password. That credential
# is the 2026 breach path, and sshd on the rebuilt ansible controller now pins
# `ansible@` to fixed operator addresses, so this step could no longer connect
# either way.
#
# The constrained deploy button routes odin-core only, deliberately: the aux
# service name is not its ghcr repository name and each playbook wants a
# different extra-var. Aux images are also private and need a PAT minted per
# deploy, which no workflow does. So deploy this from an operator workstation:
#
#   ansible-playbook deploy-setup-helper.yml \
#     -e setup_helper_docker_image=<the image this workflow pushed>
#
# See the DevOps repo:
# docs/superpowers/specs/2026-08-10-github-deploy-button-design.md
#

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "${{ github.repository }}-setup-helper-internal"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 

      - name: Log in to the Container registry
        uses: docker/login-action@v3.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          file: ./docker/Dockerfile-setup-helper
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=setup.homebase.id

      - name: Report what was pushed
        run: |
          echo "Pushed:"
          printf '%s\n' "$META_TAGS"
          echo
          echo "Deploy from an operator workstation:"
          echo "  ansible-playbook deploy-setup-helper.yml -e setup_helper_docker_image=<tag above>"
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
