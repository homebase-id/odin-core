# Local dev Stalwart for the email provider work (docs/email-keys-plan.md).
# Ports are remapped around the local odin host (which owns 80/443):
#   9080  -> admin UI + management/JMAP API (http://localhost:9080; container-internal 8080 - remapped because WebScaffold binds host 8080)
#   9443  -> same over TLS (remapped: WebScaffold binds host 8443)
#   2525  -> SMTP inbound          1587 -> submission (STARTTLS)
#   1465  -> submissions (TLS)     1143 -> IMAP        1993 -> IMAPS
# Storage: container-default RocksDB - fine for admin-API verification.
# (Production targets PostgreSQL metadata + S3 blobs; the wizard/WebUI can
# repoint backends at docker/start-dev-servers.sh's postgres later.)
services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart-dev
    restart: unless-stopped
    environment:
      # Deterministic dev admin credentials (skip fishing them out of the logs)
      STALWART_RECOVERY_ADMIN: "admin:devadminpass"
      # Recovery mode is OFF (normal operation). Re-add STALWART_RECOVERY_MODE: "1"
      # for management-API-only provisioning/repair sessions.
    ports:
      - "9080:8080"
      - "9443:443"
      - "2525:25"
      - "1587:587"
      - "1465:465"
      - "1143:143"
      - "1993:993"
      # Standard ports too, so a client that follows autoconfig (which advertises
      # 993/465 per RFC) reaches this server without hand-editing. The remapped
      # ports above stay bound so existing manual configs keep working.
      - "993:993"
      - "465:465"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

volumes:
  stalwart-etc:
  stalwart-data:
